<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <main class="content">

  <footer>

  <script>
    const features = [
      '✅ 跨平台兼容：手机、电视、电脑、盒子',
      '✅ 支持蓝牙手柄，最多四人联机',
      '✅ 自动存档和读取，断点继续无忧',
      '✅ 丰富中文游戏库持续更新'

    const list = document.getElementById('feature-list');
    features.forEach(text => {
      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
