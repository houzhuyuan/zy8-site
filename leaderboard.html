<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZY8 排行榜</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 引入 Font Awesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><i class="fas fa-trophy"></i> ZY8 排行榜</h1>
      <nav>
        <a href="index.html">首页</a>
        <a href="features.html">功能</a>
        <a href="contact.html">联系</a>
        <a href="leaderboard.html" class="active">排行榜</a>
      </nav>
      <!-- 夜间模式切换按钮 -->
      <button id="toggle-night-mode" class="night-mode-toggle"><i class="fas fa-moon"></i></button>
    </div>
  </header>
  <main class="hero">
    <h2>顶尖玩家排行榜</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家昵称</th>
          <th>得分</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>玩家A</td>
          <td>999,999</td>
        </tr>
        <tr>
          <td>2</td>
          <td>玩家B</td>
          <td>888,888</td>
        </tr>
        <tr>
          <td>3</td>
          <td>玩家C</td>
          <td>777,777</td>
        </tr>
      </tbody>
    </table>
    <a href="index.html" class="btn-glow">返回首页</a>
  </main>
  <footer>
    <p>© 2025 ZY8.TOP | 排行榜页</p>
  </footer>

  <script>
    // 夜间模式切换功能
    document.getElementById('toggle-night-mode').addEventListener('click', function() {
      document.body.classList.toggle('night-mode');
      var icon = this.querySelector('i');
      if (document.body.classList.contains('night-mode')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
  </script>
</body>
</html>
