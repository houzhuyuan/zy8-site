<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZY8 排行榜</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header role="banner">
    <div class="container">
      <h1><i class="fas fa-trophy"></i> ZY8 排行榜</h1>
      <nav role="navigation" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="features.html">功能</a>
        <a href="contact.html">联系</a>
        <a href="leaderboard.html" class="active">排行榜</a>
      </nav>
      <div class="toggle-buttons">
        <button id="toggle-night-mode" class="toggle-btn" title="切换夜间模式">
          <i class="fas fa-moon"></i>
        </button>
        <button id="toggle-music" class="toggle-btn" title="播放/暂停背景音乐">
          <i class="fas fa-music"></i>
        </button>
      </div>
    </div>
  </header>
  
  <main class="hero" role="main">
    <h2>顶尖玩家排行榜</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家昵称</th>
          <th>得分</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>玩家A</td>
          <td>999,999</td>
        </tr>
        <tr>
          <td>2</td>
          <td>玩家B</td>
          <td>888,888</td>
        </tr>
        <tr>
          <td>3</td>
          <td>玩家C</td>
          <td>777,777</td>
        </tr>
      </tbody>
    </table>
    <a href="index.html" class="btn-glow">返回首页</a>
  </main>
  
  <footer role="contentinfo">
    <p>© 2025 ZY8.TOP | 排行榜页</p>
  </footer>
</body>
</html>
